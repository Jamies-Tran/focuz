plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

def env=rootProject.file(".env")
if(env.exists()) {
    env.eachLine {
        l -> {
            if(l.contains("=")) {
                def line=l.split("=", 2)
                System.setProperty(line[0].trim(), line[1].trim())
            }
        }
    }
}
def GIT_USERNAME=System.getProperty("GIT_USERNAME")
def GIT_TOKEN=System.getProperty("GIT_TOKEN")

group = 'com.focuz'
version = '0.0.1-SNAPSHOT'
description = 'administration-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name="GithubPackage"
        url=uri("https://maven.pkg.github.com/Jamies-Tran/core-service")
        credentials{
            username=GIT_USERNAME
            password=GIT_TOKEN
        }
    }
}

ext {
    set('springCloudVersion', "2025.0.2")
    set("coreStarterVersion", property("CORE_STARTER_VERSION"))
    set("authStarterVersion", property("AUTH_STARTER_VERSION"))
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.0-M4'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation "com.focuz:core-starter:${coreStarterVersion}"
    implementation "com.focuz:auth-starter:${authStarterVersion}"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
