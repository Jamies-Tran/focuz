plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.focuz'
version = '0.0.1-SNAPSHOT'
description = 'auth-service'

def env = rootProject.file(".env")
if(env.exists()) {
    env.eachLine {
        l -> {
            if(l.contains("=")) {
                def line = l.split("=", 2)
                System.setProperty(line[0].trim(), line[1].trim())
            }
        }
    }
}
def GIT_USERNAME = System.getProperty("GIT_USERNAME")
def GIT_PASSWORD = System.getProperty("GIT_TOKEN")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    set("encryptionStarterVersion", property("ENCRYPTION_STARTER_VERSION"))
}

repositories {
    mavenCentral()
    maven {
        name="GitHubPackage"
        url=uri("https://maven.pkg.github.com/JAMIES-TRAN/focuz")
        credentials{
            username=GIT_USERNAME
            password=GIT_PASSWORD
        }
    }
}

dependencies {
    implementation "com.focuz:encryption-starter:${encryptionStarterVersion}"
    implementation 'org.springframework.boot:spring-boot-starter'
}

tasks.named('test') {
    useJUnitPlatform()
}
