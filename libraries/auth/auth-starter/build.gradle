import java.text.SimpleDateFormat

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
}

def projectGroupId="com.focuz"
def projectArtifactId="auth-starter"
def buildVersion="develop-${new SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date())}-SNAPSHOT"

def envFile=rootProject.file(".env")
if(envFile.exists()) {
    envFile.eachLine {
        l -> {
            if(l.contains("=")) {
                def line=l.split("=", 2)
                System.setProperty(line[0].trim(), line[1].trim())
            }
        }
    }
}

def GIT_USERNAME=System.getProperty("GIT_USERNAME")
def GIT_TOKEN=System.getProperty("GIT_TOKEN")

group = projectGroupId
version = buildVersion
description = projectArtifactId

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-autoconfigure'
    api 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = groupId
            artifactId=artifactId
            version=buildVersion

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }
    repositories {
        maven {
            name="GithubPackage"
            url=uri("https://maven.pkg.github.com/Jamies-Tran/focuz")
            credentials{
                username=GIT_USERNAME
                password=GIT_TOKEN
            }
        }
    }
}
